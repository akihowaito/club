name: Activate Mioo mobile and icon layout
on:
  push:
    paths:
      - .github/workflows/mioo-ios-layout.yml
permissions:
  contents: write
jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attach the tested CSS and icon script to the existing V4 page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          file = Path('mioo-gacha/index.html')
          source = file.read_text(encoding='utf-8')
          css_old = '<link rel="stylesheet" href="history.css?v=1">'
          js_old = '<script src="history.js?v=1"></script>'
          assert source.count(css_old) == 1 and source.count(js_old) == 1
          assert 'ios-mobile.css' not in source and 'ios-icons.js' not in source
          assert Path('mioo-gacha/ios-mobile.css').is_file()
          assert Path('mioo-gacha/ios-icons.js').is_file()
          source = source.replace(css_old, css_old+'\n<link rel="stylesheet" href="ios-mobile.css?v=2">', 1)
          source = source.replace(js_old, js_old+'\n<script src="ios-icons.js?v=2"></script>', 1)
          file.write_text(source, encoding='utf-8')
          print('Mioo V4 original markup retained; mobile and icons activated')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mioo-gacha/index.html
          git commit -m 'Activate centered mobile machine and clean iOS-style icons'
          git log -1 --format='ACTIVATION_COMMIT=%H'
          git push origin HEAD:main
